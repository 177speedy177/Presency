<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Presency preview system works</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      background: radial-gradient(ellipse 80% 60% at 50% 30%, #1c1810 0%, #0d0c0a 100%);
      color: #f7f4ef;
      padding: 24px;
    }
    .card {
      max-width: 540px;
      width: 100%;
      text-align: center;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(201, 168, 76, 0.3);
      border-radius: 20px;
      padding: 48px 36px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.4);
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #c9a84c;
      border: 1px solid rgba(201, 168, 76, 0.35);
      border-radius: 999px;
      padding: 6px 14px;
      margin-bottom: 22px;
    }
    h1 {
      font-size: 28px;
      font-weight: 600;
      line-height: 1.25;
      margin-bottom: 14px;
    }
    .check { color: #4ade80; }
    p {
      font-size: 15px;
      line-height: 1.6;
      color: rgba(247, 244, 239, 0.65);
    }
    .url {
      margin-top: 26px;
      font-family: Consolas, "Courier New", monospace;
      font-size: 13px;
      color: #c9a84c;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">Presency Previews</span>
    <h1>Presency preview system works <span class="check">&#9989;</span></h1>
    <p>This page is served as static HTML from the site's public folder. If you can read this, the previews system is live and ready for sample sites.</p>
    <div class="url">getpresency.com/p/test-preview/</div>
  </main>
</body>
</html>
